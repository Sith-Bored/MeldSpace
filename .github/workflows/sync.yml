name: Sync Upstream

on:
  schedule:
    - cron: '0 * * * *' # Runs hourly
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync Sith-Bored/MeldSpace -b master
